name: Mark passing Dependabot PRs for Mergery

on:
  workflow_run:
    workflows:
      - Pull request validation
    types:
      - completed

permissions:
  issues: write
  pull-requests: read

jobs:
  label:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Add Mergery auto-merge label to the passing current Dependabot head
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const repository = process.env.GITHUB_REPOSITORY;

            async function ensureLabel(name) {
              try {
                await github.rest.issues.getLabel({
                  ...context.repo,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  ...context.repo,
                  name,
                  color: "0e8a16",
                  description: "Eligible for Mergery auto-merge",
                });
              }
            }

            await ensureLabel("automerge");

            for (const candidate of run.pull_requests ?? []) {
              if (candidate.head?.sha !== run.head_sha) continue;

              const { data: pr } = await github.rest.pulls.get({
                ...context.repo,
                pull_number: candidate.number,
              });
              if (
                pr.state !== "open" ||
                pr.user.login !== "dependabot[bot]" ||
                pr.base.repo.full_name !== repository ||
                pr.head.repo?.full_name !== repository ||
                pr.head.sha !== run.head_sha
              ) {
                continue;
              }

              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: pr.number,
                labels: ["automerge"],
              });
              core.info(`Labeled passing Dependabot PR #${pr.number}.`);
            }
