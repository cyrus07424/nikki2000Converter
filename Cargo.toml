[package]
name = "nikki2000re"
version = "0.1.0"
edition = "2021"

[dependencies]
csv = "1.3"
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "wgpu"] }
encoding_rs = "0.8"
rfd = "0.15"
tempfile = "3.15"

[target.'cfg(windows)'.dependencies]
# eframe's minimal WGPU feature does not select a native graphics backend.
wgpu = { version = "25", default-features = false, features = ["dx12"] }
